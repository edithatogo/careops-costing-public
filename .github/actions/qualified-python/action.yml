name: Qualified repository-local Python
description: Activate the pinned helper runtime without replacing an existing environment.
inputs:
  python-version:
    description: Exact qualified Python patch for this helper job.
    required: true
runs:
  using: composite
  steps:
    - name: Refuse an existing helper environment
      shell: pwsh
      run: |
        $costingEnvironment = Join-Path $env:GITHUB_WORKSPACE '.venv-costing-ci'
        try { $costingExisting = Get-Item -LiteralPath $costingEnvironment -Force -ErrorAction Stop }
        catch [System.Management.Automation.ItemNotFoundException] { $costingExisting = $null }
        if ($null -ne $costingExisting) { throw 'Refusing a pre-existing helper environment.' }
        exit 0
    - name: Activate the qualified repository-local helper environment
      id: helper_runtime
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: '0.13.5'
        python-version: ${{ inputs.python-version }}
        activate-environment: true
        venv-path: .venv-costing-ci
        no-project: true
        enable-cache: false
    - name: Verify the actual helper runtime and prefix
      shell: bash
      env:
        EXPECTED_PYTHON: ${{ inputs.python-version }}
        QUALIFIED_VENV: ${{ steps.helper_runtime.outputs.venv }}
      run: |
        python -I - <<'PYCODE'
        import os, pathlib, platform, sys
        expected = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.venv-costing-ci'
        selected = pathlib.Path(os.environ['QUALIFIED_VENV'])
        if platform.python_version() != os.environ['EXPECTED_PYTHON'] or selected.resolve() != expected.resolve() or pathlib.Path(sys.prefix).resolve() != expected.resolve() or sys.prefix == sys.base_prefix:
            raise SystemExit('Expected the qualified repository-local helper interpreter.')
        print('Verified repository-local Python', platform.python_version())
        PYCODE
